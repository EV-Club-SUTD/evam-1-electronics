metadata:
  title: MotorCon-to-ESC-RL
  authors:
    Created:
      name: EVAM
      date: 2025-08-06

connectors:
  C1:
    # General
    type: Aptiv SICMA
    subtype: Female
    image:
      src: img/Delphi-24-pinout.png
      width: 400
    notes: Device side diagram is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Aptiv (formerly Delphi)
    mpn: 211PC249S0031
    supplier: Mouser
    spn: 649-211PC249S0031

    # Pinout
    pincount: 24
    pins: [A1, A2, A3, A4, A5, A6, A7, A8, B1, B2, B3, B4, B5, B6, B7, B8, C1, C2, C3, C4, C5, C6, C7, C8]
    pinlabels: [RTN (High Voltage Power Negative), 12V+ (for relay), ACC+ (DC+ for Accelerator), STL (~Stop), BST (Boost), OUT (Logic out), 1HC (Hall sensor C), VH (DC+ for Hall sensor), Vkey (Power on), L- (relay signal), ACC-OUT (Accelerator), R (Reverse), IN1 (Eco), MS (Pulse output), 1HB (Hall sensor B), THM (Motor thermistor), NC, 12V-, STH (Stop), F (Forward), ALM (~Motor Lock), BEMF (Back EMF), 1HA (Hall sensor A), RTN (High Voltage Power GND)]

  C2:
    # General
    type: Furukawa RFW
    subtype: Female
    image:
      src: img/FW-C-6F-B-pinout.png
      width: 350
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Furukawa
    mpn: FW-C-6F-B
    supplier: Aliexpress
    spn: DJ7061Y-2.3-11

    # Pinout
    pincount: 6
    pinlabels: [H1,H2,H3,H4,H5,H6]
  
  C3:
    # General
    type: Molex KK254
    subtype: Female
    image:
      src: img/MolexKK254-9-pinout.png
      width: 300
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Molex
    mpn: 22013097
    supplier: DigiKey
    spn: WM2007-MD

    # Pinout
    pincount: 9
    pinlabels: [LOCK,NC,PULSE,REVERSE,ECO,BOOST,GND,ACC,EXTRA]
  
  # TODO: Check if C4 is defined correctly
  C4:
    # General
    type: JST RCY
    subtype: Male
    image:
      src: img/JST-RCY-pinout.png # placeholder
      width: 400
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: JST
    mpn: SYR-02T-1
    supplier: DigiKey
    spn: 455-2653-ND

    # Pinout
    pincount: 2
    pinlabels: [J1, J2] # J2 is not implemented
  
  HS1: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 28 AWG

cables:
  W1:
    category: bundle
    gauge: 28 AWG
    length: 0.3 m
    colors: [GNBK, BN, BU, RD, PK, YEBK, VT, GYBK, YEGN, GN, WH, YE, BK] # Note that VT is actually sky blue
    notes: "NOTE: VT is actually sky blue"
  
  W2:
    gauge: 28 AWG
    length: 0.3 m
    colors: [RD]
    wirecount: 1

connections:
# If using Anaconda to manage Python environments, 
# please activate conda environment wireviz before compiling
  - # C1 to C2
    - C1: [A7, A8, B7, B8, C7]
    - W1: [3, 4, 10, 11, 12]
    - C2: [3, 4, 2, 5, 1]
  
  - # C1 to C3
    - C1: [A4, A5, B3, B4, B5, B6, C8]
    - W1: [1, 2, 6, 7, 8, 9, 13]
    - C3: [1, 6, 4, 8, 5, 3, 7]

  - # C1 to C4
    - C1: [B1]
    - W1: [5]
    - HS1: [1]
    - W2: [1]
    - C4: [1]