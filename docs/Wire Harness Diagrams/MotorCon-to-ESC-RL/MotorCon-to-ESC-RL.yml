metadata:
  title: MotorCon-to-ESC-RL
  authors:
    Created:
      name: EVAM
      date: 2025-08-06

connectors:
  C1:
    # General
    type: Aptiv SICMA
    subtype: Female
    image:
      src: img/Delphi-24-pinout.png
      width: 400
    notes: Device side diagram is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Aptiv (formerly Delphi)
    mpn: 211PC249S0031
    supplier: Mouser
    spn: 649-211PC249S0031

    # Pinout
    pincount: 24
    pinlabels: [A1 | RTN, A2 | 12V+, A3 | ACC+, A4 | STOP, A5 | BOOST, A6 | OUT, A7 | 1HC, A8 | VH, B1, B2, B3, B4, B5, B6, B7, B8, C1, C2, C3, C4, C5, C6, C7, C8]

  C2:
    # General
    type: Furukawa RFW
    subtype: Female
    image:
      src: img/FW-C-6F-B-pinout.png
      width: 350
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Furukawa
    mpn: FW-C-6F-B
    supplier: Aliexpress
    spn: DJ7061Y-2.3-11

    # Pinout
    pincount: 6
    pinlabels: [H1,H2,H3,H4,H5,H6]
  
  C3:
    # General
    type: Molex KK254
    subtype: Female
    image:
      src: img/MolexKK254-9-pinout.png
      width: 300
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Molex
    mpn: 22013097
    supplier: DigiKey
    spn: WM2007-MD

    # Pinout
    pincount: 9
    pinlabels: [M1,M2,M3,M4,M5,M6,M7,M8,M9]
  
  # TODO: Check if C4 is defined correctly
  C4:
    # General
    type: JST RCY
    subtype: Male
    image:
      src: img/JST-RCY-pinout.png # placeholder
      width: 400
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: JST
    mpn: SYR-02T-1
    supplier: DigiKey
    spn: 455-2653-ND

    # Pinout
    pincount: 2
    pinlabels: [J1, J2] # J2 is not implemented
  
  HS1: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 28 AWG

cables:
  W1:
    category: bundle
    gauge: 28 AWG
    length: 0.3 m
    colors: [GNBK, BN, BU, RD, PK, YEBK, VT, GYBK, YEGN, GN, WH, YE, BK] # Note that VT is actually sky blue
    notes: VT is actually sky blue
  
  W2:
    gauge: 28 AWG
    length: 0.3 m
    colors: [RD]
    wirecount: 1

connections:
# please activate conda environment wireviz before compiling
  - # C1 to C2
    - C1: [7, 8, 15, 16, 23]
    - W1: [3, 4, 10, 11, 12]
    - C2: [3, 4, 2, 5, 1]
  
  - # C1 to C3
    - C1: [4, 5, 11, 12, 13, 14, 24]
    - W1: [1, 2, 6, 7, 8, 9, 13]
    - C3: [1, 6, 4, 8, 5, 3, 7]

  - # C1 to C4
    - C1: [9]
    - W1: [5]
    - HS1: [1]
    - W2: [1]
    - C4: [1]