connectors:
  C1:
    # General
    type: GX16-6 Reverse Type
    subtype: Male
    image:
      src: img/GX16-Rev-pinout-cable.png
      width: 300
    notes: Cable side is shown; please double check CAN+ and -

    # Purchase
    ignore_in_bom: false
    manufacturer: Renhotec
    mpn: GX16-A-6-P
    supplier: Aliexpress
    spn: 1005008016363970

    # Pinout
    pins: [1, 2, 3, 4, 5, 6]
    pinlabels: [SW+ (switch+), SW- (switch-), HV (100V!), GND, CAN+, CAN-]

  C2:
    # General
    type: M12 A-key
    subtype: Female
    image:
