metadata:
  title: Master-Cable
  authors:
    Created:
      name: EVAM
      date: 2025-08-20

connectors:
  C1:
    # General
    type: GX16-6 Reverse Type
    subtype: Male
    image:
      src: img/GX16-Rev-pinout-cable.png
      width: 300
    notes: Cable side is shown; please double check CAN+ and -

    # Purchase
    ignore_in_bom: false
    manufacturer: Renhotec
    mpn: GX16-A-6-P
    supplier: Aliexpress
    spn: 1005008016363970

    # Pinout
    pins: [1, 2, 3, 4, 5, 6]
    pinlabels: [SW+ (switch+), SW- (switch-), HV (100V!), GND, CAN+, CAN-]

  C2:
    # General
    type: M12 A-key
    subtype: Female
    image:
      src: img/M12-Diagram-CANCiA106.png
      width: 350
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: CAZN
    mpn: M12-S-GWB
    supplier: Taobao
    spn: 

    # Pinout
    pincount: 6
    pinlabels: ['1','2','3','4','5','6']
  
  HS1: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS2: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS3: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS4: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

cables:
  W1:
    gauge: 22 AWG
    length: 0.5 m
    colors: [BN, WH, RD, BK, YE, GN]
  
  W2:
    gauge: 22 AWG
    length: 0.1 m
    colors: [BK, GY]

  W3:
    gauge: 22 AWG
    length: 0.1 m
    colors: [GY]
    wirecount: 1

  W4:
    category: bundle
    gauge: 22 AWG
    length: 0.1 m
    colors: [WH]
    wirecount: 1

connections:
# If using Anaconda to manage Python environments, 
# please activate conda environment wireviz before compiling
  - # C1 to HS1 to C2, Yellow Wire
    - C1: [5]
    - W1: [5]
    - HS1: [1]
    - W2: [1]
    - C2: [4]

  - # C1 to HS2 to C2, Green Wire
    - C1: [6]
    - W1: [6]
    - HS2: [1]
    - W2: [2]
    - C2: [5]

  - # C1 to W1, Red and Black Floating Wires
    - C1: [3, 4]
    - W1: [3, 4]

  - # C1 to W4, White wire
    - C1: [2]
    - W1: [2]
    - HS3: [1]

  - # C1 to W4, Brown wire
    - C1: [1]
    - W1: [1]
    - HS4: [1]