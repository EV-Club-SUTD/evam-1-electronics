metadata:
  title: Master-Cable
  authors:
    Created:
      name: EVAM
      date: 2025-08-20

connectors:
  C1:
    # General
    type: GX16-6 Reverse Type
    subtype: Male
    image:
      src: img/GX16-Rev-pinout-cable.png
      width: 300
    notes: Cable side is shown; please double check CAN+ and -

    # Purchase
    ignore_in_bom: false
    manufacturer: Renhotec
    mpn: GX16-A-6-P
    supplier: Aliexpress
    spn: 1005008016363970

    # Pinout
    pins: [1, 2, 3, 4, 5, 6]
    pinlabels: [SW+ (switch+), SW- (switch-), HV (100V!), GND, CAN+, CAN-]

  C2:
    # General
    type: Furukawa RFW
    subtype: Female
    image:
      src: img/FW-C-6F-B-pinout.png
      width: 350
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: Furukawa
    mpn: FW-C-6F-B
    supplier: Aliexpress
    spn: DJ7061Y-2.3-11

    # Pinout
    pincount: 6
    pinlabels: [H1,H2,H3,H4,H5,H6]
  
  # TODO: Check if C4 is defined correctly
  C4:
    # General
    type: JST RCY
    subtype: Female
    image:
      src: img/JST-RCY-pinout.png # placeholder
      width: 400
    notes: Cable side is shown

    # Purchase
    ignore_in_bom: false
    manufacturer: JST
    mpn: SYR-02T
    supplier: DigiKey
    spn: 455-2653-ND

    # Pinout
    pincount: 2
    pinlabels: [J1, J2] # J1 is not implemented
  
  HS1: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

cables:
  W1:
    category: bundle
    gauge: 22 AWG
    length: 0.5 m
    colors: [GNBK, BN, BU, RD, PK, YEBK, VT, GYBK, YEGN, GN, WH, YE, BK, BK] # Note that VT is actually sky blue
    notes: "NOTE: VT is actually sky blue"
  
  W2:
    gauge: 22 AWG
    length: 0.1 m
    colors: [RD]
    wirecount: 1

connections:
# If using Anaconda to manage Python environments, 
# please activate conda environment wireviz before compiling
  - # C1 to C2
    - C1: [1, 2, 3, 4, 5, 6]
    - W1: [3, 4, 10, 11, 12, 13]
    - C2: [3, 4, 2, 5, 1, 6]