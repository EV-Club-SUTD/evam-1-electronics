  HS1: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS2: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS3: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS4: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  SW1: # this is a side e-stop switch
    style: simple
    type: E-Stop Switch
    subtype: 22 AWG

  HS5: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  HS6: # this is a piece of heat shrink'd solder joint
    style: simple
    type: Heat shrink solder joint
    subtype: 22 AWG

  E1: # exposed section
    style: simple
    type: exposed section
    subtype: 22 AWG

  F1: # fork terminal
    style: simple
    type: Fork terminal
    color: RD
    subtype: 22 AWG

  F2: # fork terminal
    style: simple
    type: Fork terminal
    color: BK
    subtype: 22 AWG

  E2: # exposed section
    style: simple
    type: exposed section
    subtype: 22 AWG

  E3: # exposed section
    style: simple
    type: exposed section
    subtype: 22 AWG

cables:
  W1:
    gauge: 22 AWG
    length: 0.5 m
    colors: [BN, WH, RD, BK, YE, GN]
  
  W2:
    gauge: 22 AWG
    length: 0.1 m
    colors: [BK, GY]

  W3:
    gauge: 22 AWG
    length: 0.1 m
    colors: [GY]
    wirecount: 1

  W4:
    category: bundle
    gauge: 22 AWG
    length: 0.1 m
    colors: [BN, WH, BK, RD]

  W5:
    gauge: 22 AWG
    length: 0.1 m
    colors: [RD]
    wirecount: 1

  W6:
    gauge: 22 AWG
    length: 0.1 m
    colors: [RD]
    wirecount: 1

  W7:
    gauge: 22 AWG
    length: 0.1 m
    colors: [RD]
    wirecount: 1

  W8:
    gauge: 22 AWG
    length: 0.1 m
    colors: [RD]
    wirecount: 1

  W9:
    gauge: 22 AWG
    length: 0.1 m
    colors: [BK, RD]

  W10:
    category: bundle
    gauge: 22 AWG
    length: 0.1 m
    colors: [BK, RD]

connections:
# If using Anaconda to manage Python environments, 
# please activate conda environment wireviz before compiling
  - # C1 to HS1 to C2, Yellow Wire
    - C1: [5]
    - W1: [5]
    - HS1: [1]
    - W2: [1]
    - C2: [4]

  - # C1 to HS2 to C2, Green Wire
    - C1: [6]
    - W1: [6]
    - HS2: [1]
    - W2: [2]
    - C2: [5]

  - # C1 to W1, Red and Black Floating Wires
    - C1: [3, 4]
    - W1: [3, 4]

  - # C1 to W4, White wire
    - C1: [2]
    - W1: [2]
    - E1: [1]
    - W4: [2]
    - HS3: [1]
    - W9: [1]
    - C7: [1]

  - # C1 to W4, Brown wire
    - C1: [1]
    - W1: [1]
    - HS4: [1]
    - W5: [1]
    - C3: [2]
    - <=> 
    - C4: [2]
    - W6: [1]
    - SW1: [1]
    - W7: [1]
    - C5: [2]
    - <=>
    - C6: [2]
    - W8: [1]
    - HS5: [1]
    - W4: [1]
    - HS6: [1]
    - W9: [2]
    - C7: [2]

  - # F1 to RCY, Red Wire
    - F1: [1]
    - W10: [2]
    - E2: [1]
    - W4: [4]
    - C8: [2]

  - # F2 to RCY, Black Wire
    - F2: [1]
    - W10: [1]
    - E3: [1]
    - W4: [3]



